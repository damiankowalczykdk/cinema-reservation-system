apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-configmap
  namespace: cinema
data:
  APP_BASE_URL: https://cinema.damian-kowalczyk.dev

  HTTP_TIMEOUT: "10"
  HTTP_TIMEOUT_HEALTH_CHECK: "5"
  HTTP_TIMEOUT_LLM: "150"

  COOKIE_SECURE: "true"

  AUTH0_AUDIENCE: https://api.cinema-reservation-system.com
  AUTH0_CALLBACK_URL: https://cinema.damian-kowalczyk.dev/api/auth/callback
  AUTH0_DOMAIN: cinema-reservation-system.eu.auth0.com

  CINEMA_SERVICE_URL: http://cinema-service:8001
  PAYMENT_SERVICE_URL: http://payment-service:8002
  AI_SERVICE_URL: http://ai-service:8003
