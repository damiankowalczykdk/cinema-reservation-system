apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: cinema
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
    spec:
      containers:
        - name: temporal
          image: temporalio/temporal
          args: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
          ports:
            - containerPort: 7233
            - containerPort: 8233
          volumeMounts:
            - mountPath: /data
              name: temporal-storage
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      volumes:
        - name: temporal-storage
          persistentVolumeClaim:
            claimName: temporal-pvc
