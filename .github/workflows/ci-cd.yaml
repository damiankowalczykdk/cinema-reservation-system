name: CI/CD
on:
  push:
    branches: [main, feature/deployment]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
       - uses: actions/checkout@v4

       - name: Set up Python
         uses: actions/setup-python@v5
         with:
           python-version: "3.13"

       - name: Install pre-commit
         run: pip install pre-commit

       - name: Run pre-commit
         run: pre-commit run --all-files


  commit:
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      - name: Install conventional pre-commit
        run: pip install conventional-pre-commit

      - name: Check commit messages
        run: |
          for sha in $(git rev-list --no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$sha" > msg.txt
            conventional-pre-commit msg.txt
          done

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ['cinema-service', 'gateway', 'payment-service', 'ai-service', 'worker-service']
      fail-fast: false
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Copy env
        run: cp .env.example .env

      - name: Poetry Install
        run: poetry install

      - name: Run Test
        run: poetry run pytest

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [ 'cinema-service', 'gateway', 'payment-service', 'ai-service', 'worker-service', 'frontend' ]
      fail-fast: false
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'

    strategy:
      matrix:
        app:
          - { release: cinema, image: cinema-service }
          - { release: gateway, image: gateway }
          - { release: payment, image: payment-service }
          - { release: ai, image: ai-service }
          - { release: worker, image: worker-service }
          - { release: frontend, image: frontend }
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Helm upgrade
        run: |
          helm upgrade ${{ matrix.app.release }} k8s/chart -n cinema \
            -f k8s/apps/${{ matrix.app.release }}/values.yaml \
            -f k8s/apps/${{ matrix.app.release }}/values-prod.yaml \
            --set image=ghcr.io/${{ github.repository }}/${{ matrix.app.image }}:${{ github.sha }} \
            --wait --timeout 5m
