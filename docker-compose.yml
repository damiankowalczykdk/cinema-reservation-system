
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

    ports:
      - "5432:5432"

    networks:
      - backend

  cinema-service:
    build:
      context: ./apps/cinema-service
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS}

    volumes:
      - ./apps/cinema-service:/app
    networks:
      - backend
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - cinema-service
      - redis
    environment:
      CINEMA_SERVICE_URL: ${CINEMA_SERVICE_URL}
      REDIS_URL: ${REDIS_URL}

    volumes:
      - ./apps/ai-service:/app

    networks:
      - backend

  worker-service:
    build:
      context: ./apps/worker-service
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - temporal
      - cinema-service
    environment:
      CINEMA_SERVICE_URL: ${CINEMA_SERVICE_URL}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS}
    volumes:
      - ./apps/worker-service:/app

    networks:
      - backend

  payment-service:
    build:
      context: ./apps/payment-service
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

    environment:
      POSTGRES_PAYMENT_USER: ${POSTGRES_PAYMENT_USER}
      POSTGRES_PAYMENT_PASSWORD: ${POSTGRES_PAYMENT_PASSWORD}
      POSTGRES_PAYMENT_HOST: ${POSTGRES_PAYMENT_HOST}
      POSTGRES_PAYMENT_PORT: ${POSTGRES_PAYMENT_PORT}
      POSTGRES_PAYMENT_DB: ${POSTGRES_PAYMENT_DB}

      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS}

    volumes:
      - ./apps/payment-service:/app
    networks:
      - backend

  gateway:
    build:
      context: ./apps/gateway
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - cinema-service
      - ai-service
      - payment-service
    env_file:
      - ./apps/gateway/.env
    environment:
     CINEMA_SERVICE_URL: ${CINEMA_SERVICE_URL}
     AI_SERVICE_URL: ${AI_SERVICE_URL}
     PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/gateway:/app
    networks:
      - backend

  stripe-cli:
    image: stripe/stripe-cli:latest
    command: listen --api-key ${STRIPE_SECRET_KEY} --all-snapshot --forward-to payment-service:8002/payment/webhook
    depends_on:
      - payment-service
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - backend


  temporal:
    image: temporalio/temporal
    restart: always
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "8233:8233"
    networks:
      - backend


volumes:
  postgres_data:
  gateway:


networks:
  backend:


