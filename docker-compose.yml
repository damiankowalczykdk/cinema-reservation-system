
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

    ports:
      - "5432:5432"

    networks:
      - backend

  cinema-service:
    build:
      context: ./apps/cinema-service
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}


    volumes:
      - ./apps/cinema-service:/app
    networks:
      - backend

  payment-service:
    build:
      context: ./apps/payment-service
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PAYMENT_USER: ${POSTGRES_PAYMENT_USER}
      POSTGRES_PAYMENT_PASSWORD: ${POSTGRES_PAYMENT_PASSWORD}
      POSTGRES_PAYMENT_HOST: ${POSTGRES_PAYMENT_HOST}
      POSTGRES_PAYMENT_PORT: ${POSTGRES_PAYMENT_PORT}
      POSTGRES_PAYMENT_DB: ${POSTGRES_PAYMENT_DB}

    volumes:
      - ./apps/payment-service:/app
    networks:
      - backend

  gateway:
    build:
      context: ./apps/gateway
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - cinema-service
    env_file:
      - ./apps/gateway/.env
    environment:
     CINEMA_SERVICE_URL: ${CINEMA_SERVICE_URL}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/gateway:/app
    networks:
      - backend

  stripe-cli:
    image: stripe/stripe-cli:latest
    command: listen --api-key ${STRIPE_SECRET_KEY} --all-snapshot --forward-to payment-service:8002/payment/webhook
    depends_on:
      - payment-service
    networks:
      - backend

  reservation_expirer:
    image: curlimages/curl:latest
    restart: always
    depends_on:
      - cinema-service
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -fsS -X POST http://cinema-service:8001/reservation/expire-stale || echo "expire-stale failed"
          sleep 60
        done
    networks:
      - backend


volumes:
  postgres_data:
  gateway:


networks:
  backend:


