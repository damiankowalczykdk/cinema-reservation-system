server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # sondy liveness/readiness z chartu
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status": "ok", "message": "frontend"}';
    }

    # /api/auth/me -> http://gateway-service:8000/auth/me (końcowy "/" obcina prefiks)
    location /api/ {
        proxy_pass http://gateway-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # asystent AI może odpowiadać do HTTP_TIMEOUT_LLM=150 s
        proxy_read_timeout 180s;
    }

    # pliki z hashem w nazwie nigdy się nie zmieniają
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: nieznana ścieżka (np. /trailers po odświeżeniu) -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
