[project]
name = "payment-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Damian",email = "damiankowalczyk3688@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "stripe (>=15.6.1,<16.0.0)",
    "fastapi[standard] (>=0.139.2,<0.140.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.19.2,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)"
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
mypy = "^2.3.0"
pytest-cov = "^6.3.0"
pytest-asyncio = "^1.4.0"
testcontainers = {extras = ["postgres"], version = "^4.15.0"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
omit = ["api/dependencies.py"]