[project]
name = "worker-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Damian",email = "damiankowalczyk3688@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "tzdata (>=2026.5,<2027.0)",
    "temporalio (>=1.34.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "watchfiles (>=1.3.0,<2.0.0)",
    "aiosmtplib (>=5.1.3,<6.0.0)",
    "tzdata (>=2026.5,<2027.0)",

]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
mypy = "^2.3.0"
pytest-cov = "^6.3.0"
pytest-asyncio = "^1.4.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
omit = ["main.py"]